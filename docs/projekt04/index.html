<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Projekt 04</title>
    
    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

<div class="container">
    <p id="title" style="grid-column: 1 / -1;">Kalkulator</p>
    <div id="display" class="display"></div>
        <button id="clear">C</button>
        <button id="off">OFF</button>
        <button id="back">&leftarrow;</button>
        <button id="divide">&divide;</button>

        <button id="7" style="grid-column-start: 1;">7</button>
        <button id="8">8</button>
        <button id="9">9</button>
        <button id="multiply">&times;</button>
        
        <button id="4" style="grid-column-start: 1;">4</button>
        <button id="5">5</button>
        <button id="6">6</button>
        <button id="subtract">&minus;</button>

        <button id="1" style="grid-column-start: 1;">1</button>
        <button id="2">2</button>
        <button id="3">3</button>
        <button id="add" style="
            grid-row: 6 / 8; 
            grid-column: 4; 
            min-height: 100px;
            max-height: 100px;"
        >+</button>

        <button id="0" style="grid-column-start: 1;">0</button>
        <button id="dot">&period;</button>
        <button id="equals">&equals;</button>
        
    

</div>

</body>

</html>
